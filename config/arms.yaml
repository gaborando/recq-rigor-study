# Arm registry: the three technology constraints under test.
# constraint_clause is the ONLY prose that differs between arms in the agent prompt;
# micro_clause is appended to it (the system is always a multi-service reactor —
# the specific service decomposition is named in the domain's SPEC.md).

arms:
  arm_a_evento:
    name: "Evento (RECQ)"
    docs_pack: docs_packs/arm_a_evento
    archunit_arm: ARM_A
    constraint_clause: >
      You MUST implement the system using the Evento Framework
      (com.eventoframework:evento-bundle — already wired in the skeleton).
      Model the write side with @Aggregate components (commands -> events),
      the read side with @Projector + @Projection components, cross-aggregate
      processes with @Saga components, and external/stateless work with
      @Service or @Observer components. All inter-component communication goes
      through the Evento gateways. Documentation is in ./docs.
    micro_clause: >
      Deliver the services of the provided Maven reactor as independent Evento
      bundles (the SPEC names the decomposition), each its own deployable with
      its own database. Services integrate ONLY through the Evento server
      (commands/queries/events across bundles); no service reads another's
      database. Shared payload types live in the api module; the per-service
      EventoConfiguration is pre-wired.

  arm_b_spring:
    name: "Plain Spring Boot"
    docs_pack: docs_packs/arm_b_spring
    archunit_arm: ARM_B
    constraint_clause: >
      You MUST implement the system in plain Spring Boot. You may use Spring
      Web, Spring Data JPA, and the JDK; you MUST NOT add any CQRS, event
      sourcing, messaging, or actor framework dependency. Any consistency,
      idempotency, or concurrency handling the tests require must be
      implemented by you. Documentation is in ./docs.
    micro_clause: >
      Deliver the services of the provided Maven reactor as independent Spring
      Boot services (the SPEC names the decomposition), each its own deployable
      with its own database. There is NO broker: services integrate over
      HTTP/REST, and you must implement any cross-service idempotency, retry,
      and saga compensation yourself. No service may read another's database.

  arm_c_axon:
    name: "Axon Framework"
    docs_pack: docs_packs/arm_c_axon
    archunit_arm: ARM_C
    constraint_clause: >
      You MUST implement the system using Axon Framework
      (axon-spring-boot-starter — already wired in the skeleton). Model the
      write side with @Aggregate classes (commands -> events), the read side
      with @EventHandler projections, and cross-aggregate processes with sagas
      or event processors. Documentation is in ./docs.
    micro_clause: >
      Deliver the services of the provided Maven reactor as independent Axon
      services (the SPEC names the decomposition), each its own deployable with
      its own database. Services integrate through Axon Server (already
      configured) for distributed command/event/query routing; no service reads
      another's database. Shared messages live in the api module.
