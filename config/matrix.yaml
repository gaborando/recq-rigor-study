# The experiment definition. `harness.matrix` expands this into run cells.
# Budgets are IDENTICAL across arms within a cell by construction — the harness
# refuses per-arm budget overrides.

defaults:
  budget:
    max_wall_minutes: 45        # hard kill
    max_turns: 100              # passed to the agent CLI where supported
    max_tokens: 3_000_000       # watchdog kill on cumulative tokens
  perf:                         # PERFORMANCE KPI load phase
    warmup_seconds: 30
    duration_seconds: 120
    vus: 20                     # k6 virtual users
  reps: 3

# Pilot profile: `make pilot` runs profile=pilot
profiles:
  pilot:
    reps: 1
    budget:
      max_wall_minutes: 30
      max_turns: 60
      max_tokens: 1_500_000
    cells:
      - { domain: order-inventory, arm: arm_b_spring, model: claude-sonnet, task: t1 }
      - { domain: order-inventory, arm: arm_a_evento, model: claude-sonnet, task: t1 }
      - { domain: order-inventory, arm: arm_c_axon,   model: claude-sonnet, task: t1 }
      - { domain: order-inventory, arm: arm_b_spring, model: claude-sonnet, task: t2 }

  # $0 plumbing validation: null agent on the empty micro reactor.
  micro-dry:
    reps: 1
    budget: { max_wall_minutes: 30, max_turns: 60, max_tokens: 1_500_000 }
    cells:
      - { domain: order-inventory, arm: arm_b_spring, model: null-agent, task: t1, topology: micro }

  # $0 durability-plumbing validation: resilience phase in BOTH topologies.
  dry-both:
    reps: 1
    budget: { max_wall_minutes: 30, max_turns: 60, max_tokens: 1_500_000 }
    cells:
      - { domain: order-inventory, arm: arm_b_spring, model: null-agent, task: t1, topology: single }
      - { domain: order-inventory, arm: arm_b_spring, model: null-agent, task: t1, topology: micro }

  # $0 T2-plumbing validation: seed T2 from the null T1 (both topologies),
  # verify seeding + T2 cancellation suite + change-impact + resilience-during-T2.
  dry-t2:
    reps: 1
    budget: { max_wall_minutes: 30, max_turns: 60, max_tokens: 1_500_000 }
    cells:
      - { domain: order-inventory, arm: arm_b_spring, model: null-agent, task: t2, topology: single }
      - { domain: order-inventory, arm: arm_b_spring, model: null-agent, task: t2, topology: micro }

  # Micro-topology pilot: independent multi-service delivery, 45-60min budgets.
  micro-pilot:
    reps: 1
    budget:
      max_wall_minutes: 60
      max_turns: 120
      max_tokens: 4_000_000
    perf:
      warmup_seconds: 30
      duration_seconds: 120
      vus: 20
    cells:
      - { domain: order-inventory, arm: arm_b_spring, model: claude-sonnet, task: t1, topology: micro }
      - { domain: order-inventory, arm: arm_a_evento, model: claude-sonnet, task: t1, topology: micro }
      - { domain: order-inventory, arm: arm_c_axon,   model: claude-sonnet, task: t1, topology: micro }

  full:
    topologies: [single, micro]
    domains: [order-inventory, todolist]
    arms: [arm_a_evento, arm_b_spring, arm_c_axon]
    models: [claude-sonnet, openai-gpt, gemini, open-weights]
    tasks: [t1, t2]            # t2 seeds from the same cell's t1 run
    reps: 3
