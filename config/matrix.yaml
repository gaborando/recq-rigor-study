# The experiment definition. `harness.matrix` expands this into run cells.
# The system is a microservices platform (the only topology). Budgets are
# IDENTICAL across arms within a cell by construction.

defaults:
  budget:
    max_wall_minutes: 60        # hard kill (multi-service builds take longer)
    max_turns: 120              # passed to the agent CLI where supported
    max_tokens: 4_000_000       # watchdog kill on cumulative tokens
  perf:                         # PERFORMANCE KPI load phase
    warmup_seconds: 30
    duration_seconds: 120
    vus: 20                     # k6 virtual users
  reps: 3

profiles:
  # $0 plumbing validation: null agent on the empty reactor (per domain).
  order-dry:
    reps: 1
    budget: { max_wall_minutes: 30, max_turns: 60, max_tokens: 1_500_000 }
    cells:
      - { domain: order-inventory, arm: arm_b_spring, model: null-agent, task: t1 }
  todolist-dry:
    reps: 1
    budget: { max_wall_minutes: 30, max_turns: 60, max_tokens: 1_500_000 }
    cells:
      - { domain: todolist, arm: arm_b_spring, model: null-agent, task: t1 }
  flight-dry:
    reps: 1
    budget: { max_wall_minutes: 30, max_turns: 60, max_tokens: 1_500_000 }
    cells:
      - { domain: flight, arm: arm_b_spring, model: null-agent, task: t1 }

  # Per-domain Claude pilots (cost-gated — 3 arms × T1).
  order-pilot:
    reps: 1
    cells:
      - { domain: order-inventory, arm: arm_b_spring, model: claude-sonnet, task: t1 }
      - { domain: order-inventory, arm: arm_a_evento, model: claude-sonnet, task: t1 }
      - { domain: order-inventory, arm: arm_c_axon,   model: claude-sonnet, task: t1 }
  todolist-pilot:
    reps: 1
    cells:
      - { domain: todolist, arm: arm_b_spring, model: claude-sonnet, task: t1 }
      - { domain: todolist, arm: arm_a_evento, model: claude-sonnet, task: t1 }
      - { domain: todolist, arm: arm_c_axon,   model: claude-sonnet, task: t1 }
  flight-pilot:
    reps: 1
    cells:
      - { domain: flight, arm: arm_b_spring, model: claude-sonnet, task: t1 }
      - { domain: flight, arm: arm_a_evento, model: claude-sonnet, task: t1 }
      - { domain: flight, arm: arm_c_axon,   model: claude-sonnet, task: t1 }

  # Opus-only full matrix: all 9 (arm × domain) cells, T1, 1 rep — Claude outputs only.
  opus-all:
    domains: [order-inventory, todolist, flight]
    arms: [arm_a_evento, arm_b_spring, arm_c_axon]
    models: [claude-opus]
    tasks: [t1]
    reps: 1

  full:
    domains: [order-inventory, todolist, flight]
    arms: [arm_a_evento, arm_b_spring, arm_c_axon]
    models: [claude-sonnet, openai-gpt, gemini, open-weights]
    tasks: [t1, t2]            # t2 seeds from the same cell's t1 run
    reps: 3
