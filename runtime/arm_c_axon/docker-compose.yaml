# Runtime dependencies for the Axon arm: Postgres only (embedded JPA event
# store — no Axon Server, keeping infra parity with the plain arm).
services:
  database:
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432"            # ephemeral host port
