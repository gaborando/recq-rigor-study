x-pg: &pg
  image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
  environment:
    POSTGRES_PASSWORD: secret
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  lists-db:
    <<: *pg
    environment: { POSTGRES_PASSWORD: secret, POSTGRES_DB: lists }
    ports: ["5432"]
  items-db:
    <<: *pg
    environment: { POSTGRES_PASSWORD: secret, POSTGRES_DB: items }
    ports: ["5432"]
  notifications-db:
    <<: *pg
    environment: { POSTGRES_PASSWORD: secret, POSTGRES_DB: notifications }
    ports: ["5432"]
