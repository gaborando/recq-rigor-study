# Plain-Spring micro runtime: one Postgres PER SERVICE (database-per-service),
# no broker — services integrate over REST. Digest-pinned; ephemeral host ports.
x-pg: &pg
  image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
  environment:
    POSTGRES_PASSWORD: secret
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  orders-db:
    <<: *pg
    environment: { POSTGRES_PASSWORD: secret, POSTGRES_DB: orders }
    ports: ["5432"]
  inventory-db:
    <<: *pg
    environment: { POSTGRES_PASSWORD: secret, POSTGRES_DB: inventory }
    ports: ["5432"]
  customers-db:
    <<: *pg
    environment: { POSTGRES_PASSWORD: secret, POSTGRES_DB: customers }
    ports: ["5432"]
