[project]
name = "recq-rigor-study"
version = "0.1.0"
description = "Replicable TDD LLM-developer study: Evento (RECQ) vs plain Spring vs Axon"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-json-report>=1.5",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
]

[tool.pytest.ini_options]
# Acceptance suites are invoked explicitly by the harness with -p no:cacheprovider;
# this repo-level config only sets shared defaults.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "analysis"]
