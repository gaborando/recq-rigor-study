# Provided wiring — do not remove; you may add properties below.
server.port=${PORT:8080}

# Evento server connection (transport port)
evento.server.host=${EVENTO_HOST:localhost}
evento.server.port=${EVENTO_PORT:3030}
evento.bundle.id=order-app
evento.bundle.version=1

# PostgreSQL for read models / projections (if you choose to persist them)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# the Evento JDBC consumer state store runs its OWN Flyway migration
# (evento_v2_schema_history); disable Spring's Flyway auto-config to avoid it
# scanning the default classpath location.
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
