server.port=${ITEMS_PORT:8082}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${ITEMS_DB_URL:jdbc:postgresql://localhost:5432/items}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: lists at ${LISTS_URL}
# peer: notifications at ${NOTIFICATIONS_URL}
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}
