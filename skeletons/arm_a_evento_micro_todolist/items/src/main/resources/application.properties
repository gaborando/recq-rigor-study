server.port=${ITEMS_PORT:8082}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${ITEMS_DB_URL:jdbc:postgresql://localhost:5432/items}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
# peer: edge at ${EDGE_URL}
# peer: lists at ${LISTS_URL}
# peer: notifications at ${NOTIFICATIONS_URL}
evento.server.host=${EVENTO_HOST:localhost}
evento.server.port=${EVENTO_PORT:3030}
evento.bundle.id=items
evento.bundle.version=1
