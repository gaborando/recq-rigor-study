server.port=${FLIGHTS_PORT:8081}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${FLIGHTS_DB_URL:jdbc:postgresql://localhost:5432/flights}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: bookings at ${BOOKINGS_URL}
# peer: payments at ${PAYMENTS_URL}
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}
