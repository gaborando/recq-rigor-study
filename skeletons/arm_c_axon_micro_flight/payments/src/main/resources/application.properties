server.port=${PAYMENTS_PORT:8083}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${PAYMENTS_DB_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: flights at ${FLIGHTS_URL}
# peer: bookings at ${BOOKINGS_URL}
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}
