server.port=${ORDERS_PORT:8081}
spring.datasource.url=${ORDERS_DB_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
inventory.url=${INVENTORY_URL:http://localhost:8082}
customers.url=${CUSTOMERS_URL:http://localhost:8083}
