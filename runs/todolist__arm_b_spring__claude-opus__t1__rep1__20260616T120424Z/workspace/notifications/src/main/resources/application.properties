server.port=${NOTIFICATIONS_PORT:8083}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${NOTIFICATIONS_DB_URL:jdbc:postgresql://localhost:5432/notifications}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: lists at ${LISTS_URL}
# peer: items at ${ITEMS_URL}
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000
spring.jpa.open-in-view=false
