server.port=${ORDERS_PORT:8081}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${ORDERS_DB_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: inventory at ${INVENTORY_URL}
# peer: customers at ${CUSTOMERS_URL}
evento.server.host=${EVENTO_HOST:localhost}
evento.server.port=${EVENTO_PORT:3030}
evento.bundle.id=orders
evento.bundle.version=1
