# Provided wiring — do not remove; you may add properties below.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# Axon: no Axon Server
axon.axonserver.enabled=false

# Use Jackson for event/saga serialization (Java records friendly)
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.serializer.general=jackson

# Event processor configuration
axon.eventhandling.processors.product-projection.mode=tracking
axon.eventhandling.processors.product-projection.thread-count=1
axon.eventhandling.processors.customer-projection.mode=tracking
axon.eventhandling.processors.customer-projection.thread-count=1
axon.eventhandling.processors.order-projection.mode=tracking
axon.eventhandling.processors.order-projection.thread-count=1
axon.eventhandling.processors.order-saga.mode=tracking
axon.eventhandling.processors.order-saga.thread-count=4
