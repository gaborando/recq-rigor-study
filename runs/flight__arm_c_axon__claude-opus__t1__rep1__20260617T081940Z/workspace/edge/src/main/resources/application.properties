server.port=${EDGE_PORT:8080}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# peer: flights at ${FLIGHTS_URL}
# peer: bookings at ${BOOKINGS_URL}
# peer: payments at ${PAYMENTS_URL}
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}
spring.application.name=edge
# omit null fields so reason/total/bookingId appear only when present (per the API contract)
spring.jackson.default-property-inclusion=non_null
axon.serializer.events=jackson
axon.serializer.messages=jackson
