server.port=${FLIGHTS_PORT:8081}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${FLIGHTS_DB_URL:jdbc:postgresql://localhost:5432/flights}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
# peer: edge at ${EDGE_URL}
# peer: bookings at ${BOOKINGS_URL}
# peer: payments at ${PAYMENTS_URL}
evento.server.host=${EVENTO_HOST:localhost}
evento.server.port=${EVENTO_PORT:3030}
evento.bundle.id=flights
evento.bundle.version=1
