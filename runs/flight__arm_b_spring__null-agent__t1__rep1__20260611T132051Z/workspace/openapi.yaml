openapi: 3.0.3
info:
  title: Flight Seat Reservation System
  version: "1.0"
  description: >
    Normative REST contract. Behavior is specified in SPEC.md; the acceptance
    test suite is the requirement. Each seat is bookable by at most one booking
    (never double-booked) under any concurrency. Reads may be eventually
    consistent with a 10-second convergence deadline.

paths:
  /flights:
    post:
      summary: Create a flight with seats.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatCount, seatPrice]
              properties:
                seatCount: { type: integer, minimum: 1, description: number of seats offered }
                seatPrice: { type: integer, minimum: 1, description: cents charged per seat }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "400": { description: Malformed / seatCount < 1 / seatPrice < 1 }

  /flights/{id}:
    get:
      summary: Get flight view with per-seat availability.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "404": { description: Unknown flight }

  /customers:
    post:
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, balance]
              properties:
                name: { type: string, minLength: 1 }
                balance: { type: integer, minimum: 0, description: cents }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { description: Malformed }

  /customers/{id}:
    get:
      summary: Get customer view
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { description: Unknown customer }

  /customers/{id}/deposit:
    post:
      summary: Add funds. Concurrent deposits must all be applied (no lost update).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1 }
      responses:
        "202": { description: Accepted }
        "400": { description: Malformed / amount < 1 }
        "404": { description: Unknown customer }

  /customers/{id}/notifications:
    get:
      summary: Notifications for the customer — exactly one per booking decision.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "404": { description: Unknown customer }

  /bookings:
    post:
      summary: >
        Book a specific seat. Client supplies bookingId (UUID); the operation is
        idempotent on bookingId under any concurrency — at most one booking, one
        held seat, one charge, one notification. The seat HOLD is a distributed
        lock: exactly one concurrent requester wins a given seat. Processing may
        be asynchronous.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId, customerId, flightId, seat]
              properties:
                bookingId: { type: string, format: uuid }
                customerId: { type: string }
                flightId: { type: string }
                seat: { type: string, description: seat id on the flight, e.g. "1A" }
      responses:
        "202":
          description: Accepted (also returned for an idempotent replay; 200 acceptable for replays)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "200":
          description: Idempotent replay — current booking state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { description: Malformed / unknown references / unknown seat (REJECTED outcome also acceptable) }

  /bookings/{id}:
    get:
      summary: Get booking view. Status never regresses.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { description: Unknown booking (allowed only before the write converges) }

  /stats/bookings:
    get:
      summary: Aggregate statistics over all bookings.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [confirmed, rejected, revenue]
                properties:
                  confirmed: { type: integer }
                  rejected: { type: integer }
                  revenue: { type: integer, description: sum of seatPrice of confirmed bookings, cents }

components:
  schemas:
    Seat:
      type: object
      required: [seat, available]
      properties:
        seat: { type: string }
        available: { type: boolean, description: false iff held or booked }
        bookingId: { type: string, description: present iff the seat is owned by a CONFIRMED booking }
    Flight:
      type: object
      required: [id, seatCount, seatPrice, seats]
      properties:
        id: { type: string }
        seatCount: { type: integer, minimum: 1 }
        seatPrice: { type: integer, minimum: 1 }
        seats:
          type: array
          items: { $ref: "#/components/schemas/Seat" }
    Customer:
      type: object
      required: [id, name, balance]
      properties:
        id: { type: string }
        name: { type: string }
        balance: { type: integer, minimum: 0 }
    Booking:
      type: object
      required: [bookingId, customerId, flightId, seat, status]
      properties:
        bookingId: { type: string }
        customerId: { type: string }
        flightId: { type: string }
        seat: { type: string }
        status: { type: string, enum: [PENDING, CONFIRMED, REJECTED] }
        reason: { type: string, enum: [SEAT_TAKEN, INSUFFICIENT_FUNDS], description: present iff REJECTED }
        total: { type: integer, description: present iff CONFIRMED }
    Notification:
      type: object
      required: [bookingId, status]
      properties:
        bookingId: { type: string }
        status: { type: string, enum: [CONFIRMED, REJECTED] }
        reason: { type: string }
