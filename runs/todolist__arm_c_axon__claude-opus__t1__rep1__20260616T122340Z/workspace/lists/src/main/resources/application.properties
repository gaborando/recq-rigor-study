server.port=${LISTS_PORT:8081}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${LISTS_DB_URL:jdbc:postgresql://localhost:5432/lists}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: items at ${ITEMS_URL}
# peer: notifications at ${NOTIFICATIONS_URL}
spring.application.name=lists
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.serializer.messages=jackson
# Single-threaded, single-segment tracking: total in-order processing of the
# global event stream so derived status is deterministic and convergent.
axon.eventhandling.processors.list-projection.mode=tracking
axon.eventhandling.processors.list-projection.thread-count=1
axon.eventhandling.processors.list-projection.initial-segment-count=1
