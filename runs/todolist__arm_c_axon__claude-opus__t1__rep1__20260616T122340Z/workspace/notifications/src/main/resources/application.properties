server.port=${NOTIFICATIONS_PORT:8083}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${NOTIFICATIONS_DB_URL:jdbc:postgresql://localhost:5432/notifications}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: lists at ${LISTS_URL}
# peer: items at ${ITEMS_URL}
spring.application.name=notifications
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.serializer.messages=jackson
# Single-threaded, single-segment tracking: in-order detection of completion
# transitions so each ACTIVE->COMPLETED yields exactly one notification.
axon.eventhandling.processors.notifications.mode=tracking
axon.eventhandling.processors.notifications.thread-count=1
axon.eventhandling.processors.notifications.initial-segment-count=1
