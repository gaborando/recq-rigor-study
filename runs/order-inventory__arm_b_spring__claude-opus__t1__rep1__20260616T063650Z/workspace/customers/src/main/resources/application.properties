server.port=${CUSTOMERS_PORT:8083}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${CUSTOMERS_DB_URL:jdbc:postgresql://localhost:5432/customers}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: orders at ${ORDERS_URL}
# peer: inventory at ${INVENTORY_URL}
spring.datasource.hikari.maximum-pool-size=24
spring.datasource.hikari.minimum-idle=4
