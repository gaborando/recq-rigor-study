server.port=${EDGE_PORT:8080}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# peer: orders at ${ORDERS_URL}
# peer: inventory at ${INVENTORY_URL}
# peer: customers at ${CUSTOMERS_URL}
peer.orders.url=${ORDERS_URL:http://localhost:8081}
peer.inventory.url=${INVENTORY_URL:http://localhost:8082}
peer.customers.url=${CUSTOMERS_URL:http://localhost:8083}
# edge holds no DB; allow many concurrent forwarded requests
server.tomcat.threads.max=200
