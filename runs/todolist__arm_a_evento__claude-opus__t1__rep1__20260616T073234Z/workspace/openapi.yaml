openapi: 3.0.3
info:
  title: Collaborative TodoList System
  version: "1.0"
  description: >
    Normative REST contract. Behavior is specified in SPEC.md; the acceptance
    test suite is the requirement. Reads may be eventually consistent with a
    10-second convergence deadline. The heart of the domain is exactly-once
    list completion under a concurrent final check.

paths:
  /lists:
    post:
      summary: >
        Create a list. Client supplies listId (UUID); the operation is
        idempotent on listId under any concurrency — at most one list, never
        a reset of its items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listId, name]
              properties:
                listId: { type: string, format: uuid }
                name: { type: string, minLength: 1 }
      responses:
        "202":
          description: Accepted (also returned for an idempotent replay; 200 acceptable for replays)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSummary" }
        "200":
          description: Idempotent replay — current list summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSummary" }
        "400": { description: Malformed / empty name }

  /lists/{id}:
    get:
      summary: Get list view (status + items). Status never regresses within a decided window.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListView" }
        "404": { description: Unknown list (allowed only before the write converges) }

  /lists/{id}/items:
    post:
      summary: >
        Add an item. Client supplies itemId (UUID); idempotent on itemId — a
        re-add does not duplicate the item or reset its content/checked state.
        A newly added item is unchecked.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, content]
              properties:
                itemId: { type: string, format: uuid }
                content: { type: string, minLength: 1 }
      responses:
        "202": { description: Accepted (idempotent replay also 202; 200 acceptable) }
        "400": { description: Malformed / empty content }
        "404": { description: Unknown list }

  /lists/{id}/items/{itemId}/check:
    put:
      summary: >
        Check an item (idempotent). If this is the last unchecked item, the
        list completes ACTIVE -> COMPLETED EXACTLY ONCE, even under a concurrent
        final check by multiple clients.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Accepted (idempotent replay also 202; 200 acceptable) }
        "404": { description: Unknown list or item }

  /lists/{id}/items/{itemId}/uncheck:
    put:
      summary: >
        Uncheck an item (idempotent). If the list was COMPLETED it returns to
        ACTIVE; it re-completes exactly once when all items are checked again.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Accepted (idempotent replay also 202; 200 acceptable) }
        "404": { description: Unknown list or item }

  /lists/{id}/items/{itemId}/rename:
    put:
      summary: Rename an item (idempotent). No lost update when raced against check/uncheck.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1 }
      responses:
        "202": { description: Accepted (idempotent replay also 202; 200 acceptable) }
        "400": { description: Malformed / empty content }
        "404": { description: Unknown list or item }

  /lists/{id}/notifications:
    get:
      summary: List-completion notifications — exactly one per completion transition.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "404": { description: Unknown list }

  /stats/lists:
    get:
      summary: Aggregate statistics over all lists.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [active, completed, totalItems, checkedItems]
                properties:
                  active: { type: integer, description: lists currently ACTIVE }
                  completed: { type: integer, description: lists currently COMPLETED }
                  totalItems: { type: integer, description: items across all lists }
                  checkedItems: { type: integer, description: items with checked == true across all lists }

components:
  schemas:
    ListSummary:
      type: object
      required: [listId, name, status]
      properties:
        listId: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
    Item:
      type: object
      required: [itemId, content, checked]
      properties:
        itemId: { type: string }
        content: { type: string }
        checked: { type: boolean }
    ListView:
      type: object
      required: [listId, name, status, items]
      properties:
        listId: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, COMPLETED] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
    Notification:
      type: object
      required: [listId, status]
      properties:
        listId: { type: string }
        status: { type: string, enum: [COMPLETED] }
