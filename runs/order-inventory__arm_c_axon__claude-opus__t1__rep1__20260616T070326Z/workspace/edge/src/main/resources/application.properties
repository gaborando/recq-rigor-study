server.port=${EDGE_PORT:8080}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# peer: orders at ${ORDERS_URL}
# peer: inventory at ${INVENTORY_URL}
# peer: customers at ${CUSTOMERS_URL}
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}

# --- implementation config (added) ---
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.serializer.messages=jackson
# Omit null reason/total in Order/Notification responses (present-iff semantics).
spring.jackson.default-property-inclusion=non_null
