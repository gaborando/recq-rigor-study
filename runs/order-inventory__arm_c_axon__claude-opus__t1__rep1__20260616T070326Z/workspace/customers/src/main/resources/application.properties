server.port=${CUSTOMERS_PORT:8083}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
spring.datasource.url=${CUSTOMERS_DB_URL:jdbc:postgresql://localhost:5432/customers}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:secret}
spring.jpa.hibernate.ddl-auto=update
# peer: edge at ${EDGE_URL}
# peer: orders at ${ORDERS_URL}
# peer: inventory at ${INVENTORY_URL}
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}

# --- implementation config (added) ---
# Use Jackson for events/commands/queries (records serialize cleanly; XStream needs allowlisting).
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.serializer.messages=jackson
# Give Axon's JPA token/saga stores room and a stable boot.
spring.jpa.open-in-view=false
